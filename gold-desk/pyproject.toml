[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gold-desk"
version = "1.0.0"
description = "Gold Desk Institutional Quant System — Zero Futures Volume, Pure Spot Microstructure & Levels"
authors = ["Gold Desk Quant Team <quant@gold-desk.internal>"]
readme = "README.md"
packages = [
    { include = "shared" },
    { include = "spot_engine" },
    { include = "futures_levels" }
]

[tool.poetry.dependencies]
python = "^3.10"
polars = ">=1.12.0,<1.13.0"
vectorbt = ">=0.27.0,<0.28.0"
tvdatafeed = ">=1.1.0,<1.2.0"
duckdb = ">=1.1.0,<1.2.0"
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0" }
apscheduler = ">=3.10.4"
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
httpx = ">=0.27.0"
redis = ">=5.1.0"
numpy = ">=1.26.0,<2.0.0"
scipy = ">=1.13.0"
# Critical for VectorBT JIT Compilation & Performance
numba = ">=0.59.0,<0.60.0"
llvmlite = ">=0.42.0,<0.43.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
mypy = "^1.11.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
